# Production stack on the AWS host. deploy.sh runs it as
#   docker compose --env-file /opt/hark/compose.env -f /opt/hark/compose.yaml ...
# compose.env sets HARK_IMAGE, LITESTREAM_BUCKET and AWS_REGION; app secrets
# come from the env_file files that deploy.sh renders from SSM.
#
# Nothing publishes a port: the only way in is the outbound Cloudflare Tunnel,
# which reaches hark on the compose network. That is what makes
# CF-Connecting-IP trustworthy (TRUSTED_CLIENT_IP_HEADER=cf-connecting-ip).
#
# hark and cloudflared cannot reach the instance metadata service (IMDSv2 hop
# limit 1, plus a DOCKER-USER drop rule from bootstrap.sh), so they never see
# the instance role. Litestream needs the role for S3 and talks to nothing else,
# so it runs on the host network instead of the compose network.
#
# Sidecar images are pinned to their linux/arm64 digests; to bump, change the
# tag and take the arm64 digest from `docker buildx imagetools inspect <image:tag>`.
name: hark

services:
  hark:
    image: ${HARK_IMAGE:?set HARK_IMAGE in compose.env}
    env_file: /opt/hark/.env
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: /data/hark.sqlite
    volumes:
      - hark-data:/data
    # Only /data (the volume) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:2026.10.1@sha256:6d9f470f8df4161f90df39cd97719cdb8d02a8ade3885ab9b0ec15a495820b79
    # TUNNEL_TOKEN (from CLOUDFLARE_TUNNEL_TOKEN in SSM) is read from the environment,
    # so it never appears in the process arguments.
    command: tunnel --no-autoupdate run
    env_file: /opt/hark/cloudflared.env
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  litestream:
    image: litestream/litestream:0.5.17@sha256:ebc367d2267acf1d46b46b4883352dd1a2238b8286444acb57ac2c477353aace
    command: replicate -config /etc/litestream.yml
    network_mode: host
    # Same uid as the node user that owns /data in the hark image.
    user: "1000:1000"
    environment:
      LITESTREAM_BUCKET: ${LITESTREAM_BUCKET:?set LITESTREAM_BUCKET in compose.env}
      AWS_REGION: ${AWS_REGION:?set AWS_REGION in compose.env}
    volumes:
      - hark-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  hark-data:
