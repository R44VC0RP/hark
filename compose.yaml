# The server speaks plain HTTP and sends no HSTS itself, so it must sit behind an
# edge proxy on this host. The edge must:
#   - terminate TLS and send Strict-Transport-Security;
#   - forward to 127.0.0.1:8787 (the port is published on loopback only; set
#     HARK_PUBLISH_ADDRESS only if the edge must reach it over another interface);
#   - set a client-IP header on every request, overwriting any value the client
#     sent (for example X-Real-IP or CF-Connecting-IP);
#   - and TRUSTED_CLIENT_IP_HEADER in .env must name that header, or rate limits
#     fall back to coarse global buckets.
services:
  hark:
    build: .
    ports:
      - "${HARK_PUBLISH_ADDRESS:-127.0.0.1}:8787:8787"
    # Only /data (the volume) and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      PORT: "8787"
      DATABASE_URL: /data/hark.sqlite
      # Public origin of this deployment (used for OAuth redirects + webhook URLs).
      APP_URL: ${APP_URL:?set APP_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_SIGN_IN_SERVICE_ID: ${APPLE_SIGN_IN_SERVICE_ID:-}
      APPLE_SIGN_IN_BUNDLE_ID: ${APPLE_SIGN_IN_BUNDLE_ID:-ceo.ryan.hark}
      APPLE_SIGN_IN_KEY_ID: ${APPLE_SIGN_IN_KEY_ID:-}
      APPLE_SIGN_IN_PRIVATE_KEY: ${APPLE_SIGN_IN_PRIVATE_KEY:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APNS_PRIVATE_KEY: ${APNS_PRIVATE_KEY:-}
      APNS_BUNDLE_ID: ${APNS_BUNDLE_ID:-ceo.ryan.hark}
      APNS_ENVIRONMENT: ${APNS_ENVIRONMENT:-sandbox}
      AUTUMN_API_KEY: ${AUTUMN_API_KEY:-}
      UNLIMITED_TEAM_OWNER_EMAILS: ${UNLIMITED_TEAM_OWNER_EMAILS:-}
      # Only set this to a header the edge overwrites; see env.ts for why.
      TRUSTED_CLIENT_IP_HEADER: ${TRUSTED_CLIENT_IP_HEADER:-}
      SERVICE_RATE_LIMIT_PER_MINUTE: ${SERVICE_RATE_LIMIT_PER_MINUTE:-60}
      ACCOUNT_RATE_LIMIT_PER_MINUTE: ${ACCOUNT_RATE_LIMIT_PER_MINUTE:-300}
      PRO_SERVICE_RATE_LIMIT_PER_MINUTE: ${PRO_SERVICE_RATE_LIMIT_PER_MINUTE:-300}
      PRO_ACCOUNT_RATE_LIMIT_PER_MINUTE: ${PRO_ACCOUNT_RATE_LIMIT_PER_MINUTE:-1500}
    volumes:
      - hark-data:/data
    restart: unless-stopped

volumes:
  hark-data:
