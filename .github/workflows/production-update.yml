name: Production Update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this website update
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hark-production-update
  cancel-in-progress: false

jobs:
  update:
    name: Verify and update website
    # Native arm64 build for the t4g host (free for public repositories).
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Version and integrity hash come from packageManager in package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        id: image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/hark
        run: |
          # Tags are immutable in ECR, so a re-run for an already pushed commit
          # deploys that image instead of rebuilding.
          if aws ecr describe-images --repository-name hark \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "$REPOSITORY:$GITHUB_SHA already exists; not rebuilding"
          else
            docker build --platform linux/arm64 --provenance=false \
              -t "$REPOSITORY:$GITHUB_SHA" -t "$REPOSITORY:latest" .
            docker push "$REPOSITORY:$GITHUB_SHA"
            docker push "$REPOSITORY:latest"
          fi
          echo "uri=$REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      # Runs the stack's HarkDeploy document, which accepts only an image of this
      # repository pinned to a commit sha. Host files (deploy.sh and friends) ship
      # with the CDK stack, not from here. Only the status is printed: the
      # command output stays in SSM for operators.
      - name: Deploy on the instance
        env:
          INSTANCE_ID: ${{ vars.HARK_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters Name=tag:Name,Values=hark Name=instance-state-name,Values=running \
              --query 'Reservations[].Instances[].InstanceId' --output text)
          fi
          if [ -z "$INSTANCE_ID" ] || [ "$(wc -w <<<"$INSTANCE_ID")" -ne 1 ]; then
            echo "Expected exactly one running instance tagged Name=hark, got: '$INSTANCE_ID'" >&2
            exit 1
          fi

          # shellcheck disable=SC2016 # $LATEST and $image are literal (SSM, jq)
          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name HarkDeploy \
            --document-version '$LATEST' \
            --comment "hark ${GITHUB_SHA::12}" \
            --parameters "$(jq -cn --arg image "$IMAGE_URI" '{image: [$image]}')" \
            --query Command.CommandId --output text)
          echo "SSM command $command_id on $INSTANCE_ID"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done

          echo "Status: $status"
          if [ "$status" != Success ]; then
            echo "Deploy failed; read the output with: aws ssm get-command-invocation --command-id $command_id --instance-id $INSTANCE_ID" >&2
            exit 1
          fi

      - name: Verify public deployment
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            https://hark.fyi/api/health >/dev/null
          curl --fail --show-error --silent https://hark.fyi/ \
            | grep --fixed-strings 'https://hark.fyi/ogimage.png' >/dev/null
          curl --fail --show-error --silent https://hark.fyi/pricing \
            | grep --fixed-strings '100,000 notifications per month' >/dev/null
          curl --fail --show-error --silent https://hark.fyi/robots.txt \
            | grep --fixed-strings 'Sitemap: https://hark.fyi/sitemap.xml' >/dev/null
          curl --fail --show-error --silent https://hark.fyi/sitemap.xml \
            | grep --fixed-strings '<urlset' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://hark.fyi/seo-smoke-test-missing)" = "404"
          # The original domain keeps serving the API and redirects pages.
          curl --fail --show-error --silent https://hark.ryan.ceo/api/health >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code} %{redirect_url}' \
            https://hark.ryan.ceo/pricing)" = "301 https://hark.fyi/pricing"
