name: Production Update

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Reason for this website update
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hark-production-update
  cancel-in-progress: false

jobs:
  update:
    name: Verify and update website
    # Native arm64 build for the t4g host (free for public repositories).
    runs-on: ubuntu-24.04-arm
    environment: production
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          # Version and integrity hash come from packageManager in package.json.
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint
          pnpm build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and push image
        id: image
        env:
          REPOSITORY: ${{ steps.ecr.outputs.registry }}/hark
        run: |
          docker build --platform linux/arm64 \
            -t "$REPOSITORY:$GITHUB_SHA" -t "$REPOSITORY:latest" .
          docker push "$REPOSITORY:$GITHUB_SHA"
          docker push "$REPOSITORY:latest"
          echo "uri=$REPOSITORY:$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload host bundle
        id: bundle
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="hark-deploy-${account}-${AWS_REGION}"
          tar -czf host.tar.gz -C infra/host --owner=0 --group=0 .
          aws s3 cp host.tar.gz "s3://${bucket}/host/${GITHUB_SHA}.tar.gz"
          echo "url=s3://${bucket}/host/${GITHUB_SHA}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Deploy on the instance
        env:
          INSTANCE_ID: ${{ vars.HARK_INSTANCE_ID }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          BUNDLE_URL: ${{ steps.bundle.outputs.url }}
        run: |
          if [ -z "$INSTANCE_ID" ]; then
            INSTANCE_ID=$(aws ec2 describe-instances \
              --filters Name=tag:Name,Values=hark Name=instance-state-name,Values=running \
              --query 'Reservations[].Instances[].InstanceId' --output text)
          fi
          if [ -z "$INSTANCE_ID" ] || [ "$(wc -w <<<"$INSTANCE_ID")" -ne 1 ]; then
            echo "Expected exactly one running instance tagged Name=hark, got: '$INSTANCE_ID'" >&2
            exit 1
          fi

          jq -n --arg bundle "$BUNDLE_URL" --arg image "$IMAGE_URI" --arg region "$AWS_REGION" '{
            executionTimeout: ["900"],
            commands: [
              "set -eu",
              "tmp=$(mktemp -d)",
              "aws s3 cp --region \($region) \($bundle) \"$tmp/host.tar.gz\"",
              "tar -xzf \"$tmp/host.tar.gz\" -C /opt/hark --no-same-owner --no-overwrite-dir",
              "rm -rf \"$tmp\"",
              "chmod +x /opt/hark/deploy.sh /opt/hark/restore.sh /opt/hark/bootstrap.sh",
              "/opt/hark/deploy.sh \($image)"
            ]
          }' > params.json

          command_id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "hark ${GITHUB_SHA::12}" \
            --parameters file://params.json \
            --query Command.CommandId --output text)
          echo "SSM command $command_id on $INSTANCE_ID"

          status=Pending
          for _ in $(seq 1 180); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending | InProgress | Delayed) ;;
              *) break ;;
            esac
          done

          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text || true
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text >&2 || true
          echo "Status: $status"
          test "$status" = Success

      - name: Verify public deployment
        run: |
          curl --fail --show-error --silent --retry 12 --retry-all-errors \
            https://hark.ryan.ceo/api/health >/dev/null
          curl --fail --show-error --silent https://hark.ryan.ceo/ \
            | grep --fixed-strings 'https://hark.ryan.ceo/ogimage.png' >/dev/null
          curl --fail --show-error --silent https://hark.ryan.ceo/pricing \
            | grep --fixed-strings '100,000 notifications per month' >/dev/null
          curl --fail --show-error --silent https://hark.ryan.ceo/robots.txt \
            | grep --fixed-strings 'Sitemap: https://hark.ryan.ceo/sitemap.xml' >/dev/null
          curl --fail --show-error --silent https://hark.ryan.ceo/sitemap.xml \
            | grep --fixed-strings '<urlset' >/dev/null
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            https://hark.ryan.ceo/seo-smoke-test-missing)" = "404"
