name: Live Activity previews

# Renders every Live Activity style a pull request touches on an iPhone 17 Pro
# simulator, before and after the change. This job runs the PR's code, so it
# has read-only permissions and only uploads images; the "Live Activity
# previews comment" workflow posts them.

on:
  pull_request:
    paths:
      - apps/expo/src/widgets/**
      - apps/expo/package.json
      - packages/contracts/src/**
      - patches/expo-widgets@*
      - scripts/live-activity-previews/**
      - .github/workflows/live-activity-previews*.yml

permissions:
  contents: read

concurrency:
  group: live-activity-previews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # Ryan's serve-sim fork: the `state` command and Xcode 27 touch routing.
  SERVE_SIM_REPO: https://github.com/R44VC0RP/serve-sim.git
  SERVE_SIM_SHA: 9ec40cfb5c5c2e618f0a686c66453bbd99b5ef92

defaults:
  run:
    # -eo pipefail, so a failing script fails its step even when piped.
    shell: bash

jobs:
  capture:
    name: Capture before and after
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Find affected styles
        id: affected
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          result="$(node scripts/live-activity-previews/affected-styles.mjs "$BASE_SHA" HEAD)"
          echo "$result"
          echo "styles=$(node -pe 'JSON.parse(process.argv[1]).styles.join(" ")' "$result")" >> "$GITHUB_OUTPUT"

      - name: Set up pnpm
        if: steps.affected.outputs.styles != ''
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        if: steps.affected.outputs.styles != ''
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Bun
        if: steps.affected.outputs.styles != ''
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        if: steps.affected.outputs.styles != ''
        run: |
          pnpm install --frozen-lockfile
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install --quiet pillow

      - name: Build serve-sim
        if: steps.affected.outputs.styles != ''
        run: |
          git clone --quiet "$SERVE_SIM_REPO" "$RUNNER_TEMP/serve-sim"
          cd "$RUNNER_TEMP/serve-sim"
          git checkout --quiet "$SERVE_SIM_SHA"
          bun install
          (cd packages/serve-sim && bun run build)
          npm install --global ./packages/serve-sim
          serve-sim --version

      - name: Build the app
        if: steps.affected.outputs.styles != ''
        id: build
        run: |
          app="$(scripts/live-activity-previews/build-app.sh "$RUNNER_TEMP/derived" | tail -1)"
          echo "app=$app" >> "$GITHUB_OUTPUT"

      - name: Boot the simulator
        if: steps.affected.outputs.styles != ''
        id: sim
        env:
          APP: ${{ steps.build.outputs.app }}
        run: |
          udid="$(scripts/live-activity-previews/setup-sim.sh "$APP" | tail -1)"
          [ -n "$udid" ]
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Capture
        if: steps.affected.outputs.styles != ''
        env:
          PYTHON: ${{ runner.temp }}/py/bin/python
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          STYLES: ${{ steps.affected.outputs.styles }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # shellcheck disable=SC2086
          scripts/live-activity-previews/run.sh "${{ steps.sim.outputs.udid }}" "$BASE_SHA" "$RUNNER_TEMP/previews" $STYLES
          echo "$PR_NUMBER" > "$RUNNER_TEMP/previews/pr.txt"

      - name: Upload previews
        if: steps.affected.outputs.styles != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-activity-previews
          path: |
            ${{ runner.temp }}/previews/*.png
            ${{ runner.temp }}/previews/manifest.json
            ${{ runner.temp }}/previews/pr.txt
          retention-days: 14

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-activity-previews-logs
          path: ${{ runner.temp }}/previews/*.log
          retention-days: 7
