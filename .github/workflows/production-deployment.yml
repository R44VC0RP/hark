name: Production Deployment

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: hark-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and submit iOS app
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Expo and EAS
        uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 21.1.0
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify monorepo
        run: |
          pnpm typecheck
          pnpm test
          pnpm lint

      - name: Verify Expo project
        working-directory: apps/expo
        run: |
          pnpm exec expo install --check
          npx expo-doctor@1.20.1

      - name: Build and submit to App Store Connect
        working-directory: apps/expo
        run: >-
          eas build
          --platform ios
          --profile production
          --auto-submit-with-profile production
          --message "Production deployment from ${{ github.sha }}"
          --non-interactive
          --no-wait
