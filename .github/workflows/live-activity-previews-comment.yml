name: Live Activity previews comment

# Posts the images from "Live Activity previews" on the pull request. It runs
# from the default branch with write access and never executes the PR's code:
# it only validates the uploaded files, stores the PNGs on the
# `live-activity-preview-images` branch and updates one comment per PR.
# (workflow_run workflows only run once this file is on the default branch.)

on:
  workflow_run:
    workflows: ["Live Activity previews"]
    types: [completed]

permissions: {}

jobs:
  comment:
    name: Post previews
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      BRANCH: live-activity-preview-images
    steps:
      - name: Check out trusted scripts
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Download previews
        id: download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: live-activity-previews
          path: capture
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Check the pull request
        id: pr
        if: steps.download.outcome == 'success'
        run: |
          number="$(head -c 12 capture/pr.txt | tr -d '[:space:]')"
          [[ "$number" =~ ^[0-9]+$ ]] || { echo "bad PR number"; exit 1; }
          # The artifact comes from the PR's job, so only trust the number if
          # that PR's head is the commit this run captured.
          pr_head="$(gh api "repos/$REPO/pulls/$number" -q .head.sha)"
          [ "$pr_head" = "$HEAD_SHA" ] || { echo "PR #$number head $pr_head is not $HEAD_SHA"; exit 1; }
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Store images
        id: store
        if: steps.download.outcome == 'success'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          dest="pr-$PR/$HEAD_SHA"
          work="$RUNNER_TEMP/previews-branch"
          git init --quiet "$work"
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/$REPO.git"
          if git fetch --quiet --depth 1 origin "$BRANCH"; then
            git checkout --quiet -b "$BRANCH" FETCH_HEAD
          else
            git checkout --quiet --orphan "$BRANCH"
            printf 'Live Activity preview images posted on pull requests. Generated; do not merge.\n' > README.md
            git add README.md
          fi
          mkdir -p "$dest"
          for file in "$GITHUB_WORKSPACE"/capture/*.png; do
            name="$(basename "$file")"
            [[ "$name" =~ ^[a-z][a-z0-9-]{0,31}-(before|after)\.png$ ]] || continue
            [ "$(head -c 8 "$file" | od -An -tx1 | tr -d ' \n')" = "89504e470d0a1a0a" ] || continue
            cp "$file" "$dest/$name"
          done
          git add "$dest"
          git commit --quiet -m "Previews for #$PR at ${HEAD_SHA:0:7}"
          git push --quiet origin "HEAD:$BRANCH"
          echo "base=https://raw.githubusercontent.com/$REPO/$(git rev-parse HEAD)/$dest" >> "$GITHUB_OUTPUT"

      - name: Update the comment
        if: steps.download.outcome == 'success'
        env:
          PR: ${{ steps.pr.outputs.number }}
          IMAGE_BASE: ${{ steps.store.outputs.base }}
        run: |
          node scripts/live-activity-previews/comment.mjs capture "$IMAGE_BASE" "$RUN_URL" > body.md
          existing="$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            -q '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("<!-- live-activity-previews -->"))) | .id' | head -1)"
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$existing" -F body=@body.md >/dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
