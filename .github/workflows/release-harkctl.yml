name: Release harkctl

# Publishes packages/harkctl to npm with trusted publishing (OIDC): no npm
# token is stored anywhere. npm trusts this exact workflow file in
# R44VC0RP/hark (package settings → Trusted Publisher), and every release
# carries a provenance attestation that links it to this run.
#
# Release: bump "version" in packages/harkctl/package.json on main, then
# either push a tag `harkctl-v<version>` or run this workflow by hand.
# Manual runs default to a dry run.

on:
  push:
    tags:
      - "harkctl-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and verify only; don't publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-harkctl
  cancel-in-progress: false

jobs:
  publish:
    name: Publish harkctl
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets npm exchange this run's GitHub OIDC token for a short-lived
      # publish credential, and sign the provenance statement.
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.10.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Use a current npm
        run: npm install --global npm@11

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter harkctl...

      - name: Check the version matches the tag
        if: github.event_name == 'push'
        working-directory: packages/harkctl
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "harkctl-v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}" >&2
            exit 1
          fi

      - name: Test and build
        working-directory: packages/harkctl
        run: |
          pnpm test
          pnpm build

      - name: Show what would be published
        working-directory: packages/harkctl
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'push' || inputs.dry_run == false
        working-directory: packages/harkctl
        run: npm publish --provenance --access public
